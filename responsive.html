<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AuraMed AI Responsive Mobile UI Showcase - Test and preview all 16 clinical modules across Desktop, Tablet, and Mobile viewports.">
    <title>Responsive Mobile UI Simulator | AuraMed AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .responsive-container {
            max-width: 1400px;
            margin: 110px auto 40px;
            padding: 0 24px;
        }

        .sim-toolbar-card {
            padding: 20px 28px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .viewport-btn-group {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .viewport-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-fast);
        }

        .viewport-btn.active {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Simulator Frame Container */
        .simulator-frame-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 750px;
            padding: 20px 0;
            transition: all 0.3s ease;
        }

        .device-frame {
            background: var(--surface-card);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s ease;
        }

        /* 3 Viewport Dimensions */
        .device-desktop {
            width: 100%;
            max-width: 1360px;
            height: 750px;
        }

        .device-tablet {
            width: 768px;
            height: 800px;
            border-radius: 28px;
            border-width: 12px;
        }

        .device-mobile {
            width: 375px;
            height: 720px;
            border-radius: 36px;
            border-width: 12px;
        }

        .sim-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-main);
        }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grid-pattern"></div>

    <!-- Header Navigation -->
    <header class="navbar-header scrolled">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-heart-pulse"></i></div>
                <span class="logo-text">AuraMed<span class="logo-highlight">.AI</span></span>
            </a>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-outline"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="responsive-container">
        <!-- Control Toolbar Card -->
        <div class="glass-card sim-toolbar-card">
            <div>
                <div style="font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase;">
                    <i class="fa-solid fa-mobile-screen-button"></i> Multi-Device Viewport Simulator
                </div>
                <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-main);" id="activeViewportLabel">
                    Desktop View (1360px × 750px)
                </div>
            </div>

            <!-- Page Selector Dropdown -->
            <div>
                <select class="settings-select" id="modulePageSelect" style="min-width: 220px;">
                    <option value="dashboard.html" selected>Dashboard (Module 3.3)</option>
                    <option value="chat.html">AI Medical Chat (Module 3.4)</option>
                    <option value="wizard.html">Symptom Assessment Wizard (Module 3.5)</option>
                    <option value="medicines.html">Medicine Explorer (Module 3.6)</option>
                    <option value="diseases.html">Disease Explorer (Module 3.7)</option>
                    <option value="interactions.html">Drug Interaction Checker (Module 3.8)</option>
                    <option value="results.html">Recommendation Results (Module 3.9)</option>
                    <option value="explainability.html">Explainability View (Module 3.10)</option>
                    <option value="report_viewer.html">Medical Report Viewer (Module 3.11)</option>
                    <option value="history.html">Medical History (Module 3.12)</option>
                    <option value="profile.html">User Profile (Module 3.13)</option>
                    <option value="settings.html">Application Settings (Module 3.14)</option>
                    <option value="emergency.html">Emergency Mode (Module 3.15)</option>
                    <option value="index.html">Landing Website (Module 3.1)</option>
                    <option value="auth.html">Authentication UI (Module 3.2)</option>
                </select>
            </div>

            <!-- Viewport Device Switcher Buttons -->
            <div class="viewport-btn-group">
                <button class="viewport-btn active" id="btnDesktop"><i class="fa-solid fa-desktop"></i> Desktop</button>
                <button class="viewport-btn" id="btnTablet"><i class="fa-solid fa-tablet-screen-button"></i> Tablet</button>
                <button class="viewport-btn" id="btnMobile"><i class="fa-solid fa-mobile-button"></i> Mobile</button>
            </div>
        </div>

        <!-- Simulator Frame Display -->
        <div class="simulator-frame-wrapper">
            <div class="device-frame device-desktop" id="deviceFrame">
                <iframe src="dashboard.html" class="sim-iframe" id="simIframe"></iframe>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script src="responsive.js"></script>
    <!-- Theme Enhancement: Harsh Gradients, Rainbow, Lucide -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            
            // Add rainbow class to navbar
            const navbar = document.querySelector('.navbar-header, nav');
            if (navbar && !navbar.classList.contains('navbar-harsh')) {
                navbar.classList.add('navbar-harsh');
            }
            
            // Add rainbow heading to main headings
            document.querySelectorAll('h1, h2').forEach(function(h) {
                if (!h.classList.contains('rainbow-heading')) {
                    h.classList.add('rainbow-heading');
                }
            });
            
            // Add theme toggle rainbow button
            const themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn && !themeBtn.classList.contains('theme-toggle-rainbow')) {
                themeBtn.classList.add('theme-toggle-rainbow');
            }
            
            // Add rainbow border to primary buttons
            document.querySelectorAll('.btn-primary, .btn-hero, .btn-submit, button[type="submit"]').forEach(function(btn) {
                if (!btn.classList.contains('btn-harsh')) {
                    btn.classList.add('btn-harsh');
                }
            });
            
            // Add card rainbow hover to glass cards
            document.querySelectorAll('.glass-card, .card, .metric-card, .stat-card').forEach(function(card) {
                if (!card.classList.contains('card-rainbow-hover')) {
                    card.classList.add('card-rainbow-hover');
                }
            });
            
            // Observe theme changes to update body background
            function updateBodyBg() {
                const theme = document.documentElement.getAttribute('data-theme');
                if (theme === 'light') {
                    document.body.style.backgroundColor = '#ffffff';
                } else {
                    document.body.style.backgroundColor = '#000000';
                }
            }
            
            // Initial
            updateBodyBg();
            
            // Watch for theme changes
            const observer = new MutationObserver(updateBodyBg);
            observer.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-theme']
            });
        });
    </script>
    <!-- Emoji & Em-Dash Enhancement -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add em-dash list styling to all ul/ol lists
            document.querySelectorAll('ul, ol').forEach(function(list) {
                if (!list.classList.contains('em-dash-list')) {
                    list.classList.add('em-dash-list');
                }
            });
            
            // Add drop shadow to all cards
            document.querySelectorAll('.glass-card, .card, .metric-card, .stat-card, .feature-card').forEach(function(card) {
                if (!card.classList.contains('shadow-drop-md')) {
                    card.classList.add('shadow-drop-md');
                }
                if (!card.classList.contains('shadow-hover-lift')) {
                    card.classList.add('shadow-hover-lift');
                }
            });
            
            // Add liquid glass to glass cards
            document.querySelectorAll('.glass-card').forEach(function(card) {
                if (!card.classList.contains('liquid-glass')) {
                    card.classList.add('liquid-glass');
                }
            });
            
            // Add features-3-col to sections with 3+ cards
            document.querySelectorAll('.features-grid, .grid-3, .row').forEach(function(grid) {
                const cards = grid.querySelectorAll('.glass-card, .card, .metric-card, .stat-card');
                if (cards.length >= 3) {
                    grid.classList.add('features-3-col');
                }
            });
            
            // Add emoji decorations to section headings based on keywords
            const emojiMap = {
                'AI': '🤖',
                'Clinical': '🩺',
                'Medical': '🏥',
                'Health': '💚',
                'Diagnostic': '🔬',
                'Emergency': '🚨',
                'Dashboard': '📊',
                'Settings': '⚙️',
                'Profile': '👤',
                'Report': '📄',
                'Medicine': '💊',
                'Drug': '💊',
                'Chat': '💬',
                'History': '🕐',
                'Notification': '🔔',
                'Admin': '👑',
                'Security': '🛡️',
                'Performance': '⚡',
                'Accessibility': '♿',
                'Explainability': '💡',
                'Feature': '⭐',
                'Welcome': '👋',
                'Login': '🔐',
                'Register': '📝',
                'Home': '🏠',
                'Disease': '🧠',
                'Symptom': '🩺',
                'Treatment': '💉',
                'Lab': '🧪',
                'Voice': '🎙️',
                'Image': '📷',
                'Document': '📁',
                'Search': '🔍',
                'Results': '📋',
                'Insights': '💡',
                'Pipeline': '🔧',
                'Metrics': '📈',
                'Safety': '🛡️',
                'Guardrail': '🛡️',
                'Knowledge': '📚',
                'Reasoning': '🧠',
                'Evidence': '📚',
                'Guideline': '📖',
                'Dosage': '💊',
                'Interaction': '⚠️',
                'Differential': '🔬',
                'Confidence': '🎯',
                'Explain': '💡',
                'Timeline': '🕐',
                'Analytics': '📊',
                'Monitoring': '👁️',
                'Logs': '📋',
                'Backup': '💾',
                'Deploy': '🚀',
                'Test': '🧪',
                'CI/CD': '🔄',
                'Docker': '🐦',
                'Database': '🗄️',
                'API': '🔌',
                'Gateway': '🌐',
                'Cache': '⚡',
                'Queue': '📨',
                'Audit': '📝',
                'User': '👤',
                'Role': '🎭',
                'Permission': '🔐',
                'Session': '\U0001F511',
                'Token': '🎫',
                'OAuth': '🔐',
                'Payment': '💳',
                'Billing': '💵',
                'Plan': '📦',
                'Subscription': '💳',
                'Webhook': '🔗',
                'Stripe': '💳'
            };
            
            // Add emojis before matching headings
            document.querySelectorAll('h1, h2, h3').forEach(function(heading) {
                const text = heading.textContent;
                for (const [keyword, emoji] of Object.entries(emojiMap)) {
                    if (text.includes(keyword) && !heading.dataset.emojiAdded) {
                        const span = document.createElement('span');
                        span.className = 'emoji-icon';
                        span.style.marginRight = '8px';
                        span.textContent = emoji;
                        heading.insertBefore(span, heading.firstChild);
                        heading.dataset.emojiAdded = 'true';
                        break;
                    }
                }
            });
        });
    </script>
</body>
</html>

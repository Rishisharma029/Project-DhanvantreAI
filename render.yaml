services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: auramed-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: auramed-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: auramed-redis
          property: connectionString

  # 2. Frontend Static Site Service
  - type: static
    name: auramed-frontend
    buildCommand: echo "Building static frontend..."
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: auramed-postgres
    databaseName: auramed_db
    user: auramed_user
    plan: standard

version: "1.0"
runtime: python3
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: PORT
  health-check:
    protocol: HTTP
    path: /health
    interval: 10
    timeout: 5
    healthy-threshold: 2
    unhealthy-threshold: 3

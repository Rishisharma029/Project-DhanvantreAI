version: '3.8'

services:
  # =========================================================
  # 1. PostgreSQL Database Service
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: auramed_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auramed_db}
      POSTGRES_USER: ${POSTGRES_USER:-auramed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureClinicalPass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auramed_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auramed_user} -d ${POSTGRES_DB:-auramed_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # 2. Redis Caching & Task Queue Service
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: auramed_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecurePass2026!}
    volumes:
      - redis_data:/data
    networks:
      - auramed_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # 3. FastAPI Backend Service (Multi-Stage Docker)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auramed_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-auramed_user}:${POSTGRES_PASSWORD:-SecureClinicalPass2026!}@postgres:5432/${POSTGRES_DB:-auramed_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_medical_platform_2026}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,https://auramed.ai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auramed_network
    volumes:
      - ./medical_database.db:/app/medical_database.db

  # =========================================================
  # 4. Frontend Web Service (Multi-Stage Docker)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auramed_frontend
    restart: always
    networks:
      - auramed_network

  # =========================================================
  # 5. Nginx Reverse Proxy Service
  # =========================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: auramed_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - auramed_network

networks:
  auramed_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
